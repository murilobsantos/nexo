<!doctype html><meta charset="utf-8"><title>NEXO local graphics probe</title>
<canvas id="canvas" width="1280" height="720"></canvas>
<script>
const canvas=document.querySelector('canvas');
const gl=canvas.getContext('webgl',{antialias:false,preserveDrawingBuffer:false});
if(!gl)throw new Error('WebGL indisponível');
function shader(type,text){const s=gl.createShader(type);gl.shaderSource(s,text);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(s));return s;}
const program=gl.createProgram();
gl.attachShader(program,shader(gl.VERTEX_SHADER,'attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}'));
gl.attachShader(program,shader(gl.FRAGMENT_SHADER,`precision highp float;uniform float frame;void main(){vec2 p=gl_FragCoord.xy/vec2(1280.,720.);float v=p.x+p.y+frame*.0001;for(int i=0;i<64;i++){v=sin(v*1.97+p.x*float(i)+p.y)+cos(v*.71+p.y*float(i));}gl_FragColor=vec4(sin(v),cos(v),sin(v*.5),1.);}`));
gl.linkProgram(program);if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(program));
gl.useProgram(program);const buffer=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buffer);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
const position=gl.getAttribLocation(program,'p');gl.enableVertexAttribArray(position);gl.vertexAttribPointer(position,2,gl.FLOAT,false,0,0);
const uniform=gl.getUniformLocation(program,'frame');
const debug=gl.getExtension('WEBGL_debug_renderer_info');
window.renderer=debug?gl.getParameter(debug.UNMASKED_RENDERER_WEBGL):gl.getParameter(gl.RENDERER);
window.probe=async function(seconds){const durations=[],intervals=[],pixel=new Uint8Array(4);let frame=0,checksum=0;let previous=performance.now();const start=previous;while(performance.now()-start<seconds*1000){await new Promise(requestAnimationFrame);const now=performance.now();intervals.push(now-previous);previous=now;const before=performance.now();gl.uniform1f(uniform,frame++);gl.drawArrays(gl.TRIANGLES,0,3);gl.readPixels(640,360,1,1,gl.RGBA,gl.UNSIGNED_BYTE,pixel);durations.push(performance.now()-before);checksum=(checksum+pixel[0]+pixel[1]*3+pixel[2]*5)>>>0;if(gl.isContextLost())throw new Error('Contexto WebGL perdido');}return{frames:frame,seconds:(performance.now()-start)/1000,draw_readback_ms:durations,frame_intervals_ms:intervals,pixel_checksum:checksum,last_pixel:Array.from(pixel),error:gl.getError()};};
</script>
