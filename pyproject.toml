[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nexo-local"
version = "0.2.0"
description = "Assistente pessoal local e persistente"
requires-python = ">=3.12"
dependencies = ["fastapi==0.143.3", "uvicorn==0.54.0", "httpx==0.28.1", "psutil==7.2.2"]

[tool.setuptools.packages.find]
include = ["nexo*"]
